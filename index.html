<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dairy Dove – Product Order Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ================= Dairy Dove Form ================= */
  .dd-wrap, .dd-wrap * { box-sizing: border-box; }
  .dd-wrap {
    --dd-blue: #0033CC;
    --dd-field: #EBEEFB;
    --dd-field-focus: #DCE2FA;
    --dd-lav: #E3E1F5;
    --dd-pad: 34px;
    font-family: 'Poppins', sans-serif;
    font-weight: 400;
    color: var(--dd-blue);
    max-width: 1000px;
    margin: 24px auto;
    background: #fff;
    box-shadow: 0 4px 30px rgba(0, 51, 204, .10);
    overflow: hidden;
  }
  .dd-wrap label, .dd-label { font-size: 15.5px; line-height: 1.3; }

  /* ---------- Header ---------- */
  .dd-header { position: relative; min-height: 180px; padding: 22px var(--dd-pad) 0; }
  .dd-header::before {
    content: ""; position: absolute; inset: 0; background: var(--dd-blue);
    clip-path: polygon(0 0, 72% 0, 4% 82%, 0 82%);
  }
  .dd-header::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--dd-lav), rgba(227,225,245,0));
    clip-path: polygon(72% 0, 80% 0, 6% 80%, 4% 82%);
  }
  .dd-head-text { position: relative; z-index: 1; color: #fff; font-weight: 500; }
  .dd-company { font-size: 22px; line-height: 1.3; margin: 0; font-weight: 500; }
  .dd-phone { font-size: 21px; display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .dd-phone a { color: #fff; text-decoration: none; }
  .dd-phone svg { width: 20px; height: 20px; fill: #fff; flex: none; }
  .dd-address {
    position: relative; z-index: 1; display: inline-block;
    background: var(--dd-blue); color: #fff; font-weight: 500; font-size: 24px;
    padding: 6px 60px 6px var(--dd-pad); margin: 52px 0 0 calc(var(--dd-pad) * -1);
    clip-path: polygon(0 0, 96% 0, 100% 100%, 0 100%);
  }
  .dd-logo { position: absolute; z-index: 1; right: var(--dd-pad); top: 26px; width: 250px; max-width: 32%; }
  .dd-logo img { width: 100%; height: auto; display: block; }

  .dd-body { padding: 24px var(--dd-pad) 10px; }

  /* ---------- Inputs ---------- */
  .dd-wrap input[type=text], .dd-wrap input[type=email], .dd-wrap input[type=tel],
  .dd-wrap input[type=number], .dd-wrap input[type=date], .dd-wrap textarea {
    width: 100%; min-width: 0; border: 0; border-radius: 0; background: var(--dd-field);
    font-family: inherit; font-size: 15px; color: #10215c;
    padding: 9px 12px; height: 40px; outline: none; margin: 0;
    transition: background .2s, box-shadow .2s;
    -webkit-appearance: none; appearance: none;
  }
  .dd-wrap input:focus, .dd-wrap textarea:focus {
    background: var(--dd-field-focus); box-shadow: inset 0 -2px 0 var(--dd-blue);
  }
  .dd-wrap textarea { resize: vertical; height: auto; min-height: 84px; display: block; }
  .dd-wrap input[type=date]::-webkit-date-and-time-value { text-align: left; }

  /* ---------- Main grid: Label | Input | Label | Input ----------
     Every field is a .dd-f (label + input). On desktop .dd-f uses
     display:contents so its label & input sit straight in the grid. */
  .dd-grid {
    display: grid;
    grid-template-columns: 180px minmax(0,1fr) auto minmax(0,1fr);
    gap: 8px 12px; align-items: center;
  }
  .dd-f { display: contents; }
  .dd-f.dd-full > input { grid-column: 2 / -1; }
  .dd-f.dd-right > label { justify-self: end; padding-left: 6px; white-space: nowrap; }
  .dd-f > label { white-space: nowrap; }
  /* Phone box spans the City + Email rows, Email input runs under "Phone :" */
  .dd-f.dd-tall > input { grid-row: span 2; height: 88px; align-self: stretch; }
  .dd-f.dd-wide > input { grid-column: 2 / 4; }

  /* ---------- Category sections ---------- */
  .dd-section { margin: 16px calc(var(--dd-pad) * -1) 0; }
  .dd-cat {
    display: grid; grid-template-columns: auto minmax(0,1fr);
    align-items: center; gap: 12px; padding-right: var(--dd-pad); margin-bottom: 8px;
  }
  .dd-cat-tag {
    background: var(--dd-blue); color: #fff; font-size: 16px;
    padding: 8px 18px 8px var(--dd-pad); white-space: nowrap; min-width: 240px;
  }
  .dd-cat-fields {
    display: grid; grid-template-columns: auto minmax(0,1fr) auto minmax(0,1fr);
    gap: 8px 12px; align-items: center;
  }
  .dd-cat-fields.dd-one { grid-template-columns: auto minmax(0,1fr); }
  .dd-cat-fields.dd-only { grid-template-columns: minmax(0,1fr); }
  .dd-sub {
    display: grid; grid-template-columns: 180px minmax(0,1fr) auto minmax(0,1fr);
    gap: 8px 12px; align-items: center; padding: 0 var(--dd-pad); margin-bottom: 8px;
  }
  .dd-desc { margin-right: var(--dd-pad); background: var(--dd-field); transition: background .2s; }
  .dd-desc label { display: block; padding: 8px 12px 0 var(--dd-pad); }
  .dd-wrap .dd-desc textarea { padding-left: var(--dd-pad); background: transparent; }
  .dd-desc:focus-within { background: var(--dd-field-focus); }

  /* ---------- Signatures ---------- */
  .dd-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 60px; padding: 34px var(--dd-pad) 30px; }
  .dd-line { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 10px; min-width: 0; }
  .dd-line label { white-space: nowrap; }
  .dd-wrap .dd-line input {
    flex: 1; min-width: 0; border: 0; border-bottom: 2px dotted var(--dd-blue);
    background: transparent; box-shadow: none; padding: 4px; height: 32px;
  }
  .dd-wrap .dd-line input:focus { border-bottom-style: solid; background: transparent; box-shadow: none; }
  .dd-line-split { display: flex; gap: 16px; }
  .dd-line-split .dd-line { flex: 1; }
  .dd-wrap .dd-line input.dd-sig { font-style: italic; font-size: 17px; }

  /* ---------- Actions ---------- */
  .dd-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 0 var(--dd-pad) 28px; }
  .dd-btn {
    font-family: inherit; font-weight: 500; font-size: 15px; cursor: pointer;
    border: 2px solid var(--dd-blue); padding: 11px 34px; transition: .2s;
  }
  .dd-btn-primary { background: var(--dd-blue); color: #fff; }
  .dd-btn-primary:hover { background: #0029a3; border-color: #0029a3; }
  .dd-btn-primary[disabled] { opacity: .6; cursor: wait; }
  .dd-btn-ghost { background: #fff; color: var(--dd-blue); }
  .dd-btn-ghost:hover { background: var(--dd-field); }
  .dd-msg { text-align: center; padding: 0 var(--dd-pad) 18px; font-weight: 500; display: none; }
  .dd-footer { height: 18px; background: var(--dd-blue); }
  .dd-hp { position: absolute !important; left: -9999px !important; }

  /* ================= Tablet ================= */
  @media (max-width: 860px) {
    .dd-wrap { --dd-pad: 24px; }
    .dd-grid, .dd-sub { grid-template-columns: 150px minmax(0,1fr) auto minmax(0,1fr); }
    .dd-wrap label { font-size: 14.5px; }
    .dd-cat { grid-template-columns: 1fr; padding-right: 0; }
    .dd-cat-tag { justify-self: start; min-width: 0; }
    .dd-cat-fields { padding: 0 var(--dd-pad); }
    .dd-address { font-size: 20px; margin-top: 44px; }
  }

  /* ================= Mobile =================
     Pairs (Country/State, City/Phone, Pallets/Cases, etc.) stay
     side-by-side; the label sits above its box to save width. */
  @media (max-width: 600px) {
    .dd-wrap { --dd-pad: 16px; margin: 0; box-shadow: none; }
    .dd-header { padding: 0; min-height: 0; }
    .dd-header::before, .dd-header::after { display: none; }
    .dd-head-text { background: var(--dd-blue); padding: 18px 16px 14px; }
    .dd-company { font-size: 18px; }
    .dd-phone { font-size: 17px; }
    .dd-address { display: block; margin: 0; font-size: 16px; padding: 0 16px 16px; clip-path: none; }
    .dd-logo { position: static; width: 190px; max-width: 60%; margin: 18px auto 0; }
    .dd-body { padding: 18px 16px 6px; }

    .dd-grid, .dd-sub, .dd-cat-fields, .dd-cat-fields.dd-one {
      grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px 10px; align-items: end;
    }
    .dd-f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .dd-f > label, .dd-f.dd-right > label { justify-self: auto; padding-left: 0; white-space: normal; }
    .dd-f.dd-full, .dd-f.dd-wide { grid-column: 1 / -1; }
    .dd-f.dd-tall > input { height: 40px; }
    .dd-cat-fields.dd-one .dd-f { grid-column: 1 / -1; }
    .dd-cat-fields.dd-only { grid-template-columns: 1fr; }
    .dd-wrap label { font-size: 14px; }
    .dd-cat-tag { font-size: 15px; }
    .dd-desc { margin: 0 16px; }
    .dd-desc label { padding-left: 12px; }
    .dd-wrap .dd-desc textarea { padding-left: 12px; }
    .dd-sign { grid-template-columns: 1fr; padding: 24px 16px; gap: 22px; }
    .dd-line-split { gap: 10px; }
    .dd-line-split .dd-line:first-child { flex: 1.5; }
    .dd-actions { padding: 0 16px 24px; }
    .dd-btn { flex: 1 1 100%; }
    .dd-wrap input, .dd-wrap textarea { font-size: 16px !important; } /* no iOS zoom */
  }

  /* ================= Print / Save as PDF ================= */
  @media print {
    @page { size: A4; margin: 8mm; }
    body { margin: 0; background: #fff !important; }
    .dd-wrap { box-shadow: none; margin: 0; max-width: none; }
    .dd-actions, .dd-msg { display: none !important; }
    .dd-wrap * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>

<script>
(function () {
  var form = document.getElementById('ddForm');
  var msg = document.getElementById('ddMsg');
  var btn = document.getElementById('ddSubmit');
  var AJAX_URL = 'https://formsubmit.co/ajax/dairydoves@gmail.com';

  function show(text, ok) {
    msg.textContent = text;
    msg.style.color = ok ? '#0a8a3a' : '#c62828';
    msg.style.display = 'block';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var bad = form.querySelector(':invalid');
    if (bad) {
      show('Please fill in Business Name and a valid Email before submitting.', false);
      bad.focus();
      return;
    }
    btn.disabled = true; btn.textContent = 'Sending...';
    fetch(AJAX_URL, {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      body: new FormData(form)
    })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (res.ok && String(res.d.success) === 'true') {
        show('Thank you! Your form has been submitted successfully.', true);
        form.reset();
      } else {
        show((res.d && res.d.message) || 'Something went wrong. Please try again or call (312) 981-9323.', false);
      }
    })
    .catch(function () {
      // Network/JS fallback: normal form post straight to FormSubmit
      form.submit();
    })
    .finally(function () { btn.disabled = false; btn.textContent = 'Submit Form'; });
  });

  form.addEventListener('reset', function (e) {
    if (e.isTrusted) msg.style.display = 'none';
  });
})();
</script>
